<section
  class="lcdp-table-lecture-admin"
  aria-label="Table de lecture admin"
  data-lcdp-table-lecture-admin
>
  <p
    class="lcdp-table-lecture-admin__status"
    data-lcdp-table-lecture-admin-loading
    role="status"
    aria-hidden="true"
    hidden
  ></p>

  <div
    class="lcdp-table-lecture-admin__scroll"
    data-lcdp-table-lecture-admin-scroll
    hidden
  >
    <table class="lcdp-table-lecture-admin__table">
      <thead>
        <tr data-lcdp-table-lecture-admin-head></tr>
        <tr
          class="lcdp-table-lecture-admin__sorts"
          data-lcdp-table-lecture-admin-sorts
        ></tr>
        <tr
          class="lcdp-table-lecture-admin__filters"
          data-lcdp-table-lecture-admin-filters
        ></tr>
      </thead>

      <tbody data-lcdp-table-lecture-admin-body></tbody>
    </table>
  </div>

  <nav
    class="lcdp-table-lecture-admin__pagination"
    data-lcdp-table-lecture-admin-pagination
    aria-label="Pagination de la table"
    hidden
  >
    <p
      class="lcdp-table-lecture-admin__pagination-info"
      data-lcdp-table-lecture-admin-pagination-info
    ></p>

    <div class="lcdp-table-lecture-admin__pagination-actions">
      <button
        type="button"
        class="lcdp-table-lecture-admin__pagination-button"
        data-lcdp-table-lecture-admin-previous
      >
        Précédent
      </button>

      <span
        class="lcdp-table-lecture-admin__pagination-page"
        data-lcdp-table-lecture-admin-page
        aria-live="polite"
      ></span>

      <button
        type="button"
        class="lcdp-table-lecture-admin__pagination-button"
        data-lcdp-table-lecture-admin-next
      >
        Suivant
      </button>
    </div>
  </nav>

  <p
    class="lcdp-table-lecture-admin__status"
    data-lcdp-table-lecture-admin-empty
    hidden
  >
    Aucun résultat.
  </p>

  <p
    class="lcdp-table-lecture-admin__status lcdp-table-lecture-admin__status--error"
    data-lcdp-table-lecture-admin-error
    role="alert"
    hidden
  ></p>
</section>
