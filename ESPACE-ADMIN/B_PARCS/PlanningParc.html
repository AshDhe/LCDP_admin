<!doctype html>
<html lang="fr" data-lcdp-css="c044 c046 c051 c052 c070 c071 c075 c077">
<head>
  <meta charset="utf-8">

  <title>Planning Parc - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consultation du planning des parcs dans l’espace admin La Clé du Parc.">

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-module-02.css",
        "/CSSBASE/lcdp-central-module-03.css",
        "/CSSBASE/lcdp-central-module-04.css",
        "/CSSBASE/lcdp-central-module-05.css",
        "/CSSBASE/lcdp-central-module-07.css",
        "/CSSBASE/lcdp-central-module-09-fondations.css",
        "/CSSBASE/lcdp-central-module-11-etats-dynamiques.css",
        "/CSSBASE/lcdp-central-module-14-document-planifier.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/table-lecture-admin.css",
        "/ESPACE-ADMIN/B_PARCS/PlanningParc.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });
    })();
  </script>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-planning-parc-admin">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section class="lcdp-page-section" aria-label="Planning Parc">
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <header class="lcdp-planning-parc-admin__entete">
                <h1 class="lcdp-planning-parc-admin__titre">Planning Parc</h1>
              </header>

              <div class="lcdp-stack-large">
              <nav aria-label="Catégorie de planning">
                <button type="button" class="lcdp-button lcdp-button-primary" data-planning-categorie="total" aria-pressed="true">Total</button>
                <button type="button" class="lcdp-button lcdp-button-secondary" data-planning-categorie="duo" aria-pressed="false">Duo seul</button>
                <button type="button" class="lcdp-button lcdp-button-secondary" data-planning-categorie="famille" aria-pressed="false">Famille</button>
                <button type="button" class="lcdp-button lcdp-button-secondary" data-planning-categorie="coach" aria-pressed="false">Coach</button>
                <button type="button" class="lcdp-button lcdp-button-secondary" data-planning-categorie="famillecoach" aria-pressed="false">Famille + Coach</button>
              </nav>
              <nav class="lcdp-planning-parc-admin__mois-nav" aria-label="Mois de synthèse">
                <button type="button" data-planning-mois-prev aria-label="Mois précédent">‹</button>
                <strong data-planning-mois-label></strong>
                <button type="button" data-planning-mois-next aria-label="Mois suivant">›</button>
              </nav>
              </div>
              <div class="lcdp-planning-parc-admin__outils">
                <label class="lcdp-planning-parc-admin__ouvertures">
                  <input type="checkbox" data-planning-avec-ouvertures checked>
                  Avec ouvertures uniquement
                </label>
                <span class="lcdp-planning-parc-admin__indice">Les compteurs correspondent aux ouvertures du mois sélectionné.</span>
              </div>
              <div id="lcdp-planning-parc-table-slot"></div>
            </div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-lightbox-slot"></div>
  </div>

  <script src="./PlanningParc.js"></script>
</body>
</html>
