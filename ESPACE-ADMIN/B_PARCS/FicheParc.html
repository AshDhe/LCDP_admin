<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche Parc - La Clé du Parc</title>
  <meta name="description" content="Liste des parcs et consultation de leur fiche depuis l’administration.">
  <script src="../../config.js"></script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const base = value => String(value || "").replace(/\/+$/, "");
      const join = (url, path) => base(url) + "/" + String(path || "").replace(/^\/+/, "");
      const adminBase = base(config.adminBaseUrl || config.ADMIN_BASE || config.siteBase || "");
      const publicBase = base(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = base(config.objetBaseUrl || config.OBJET_BASE || join(publicBase, "/OBJET"));
      window.LCDP_urlAdmin = path => typeof config.adminUrl === "function" ? config.adminUrl(path) : join(adminBase, path);
      window.LCDP_urlPublic = path => typeof config.publicUrl === "function" ? config.publicUrl(path) : join(publicBase, path);
      window.LCDP_urlObjet = path => typeof config.objetUrl === "function" ? config.objetUrl(path) : join(objetBase, path);
      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
        "/CSSBASE/lcdp-central-module-01.css",
        "/CSSBASE/lcdp-central-module-05.css",
        "/CSSBASE/lcdp-central-module-06.css",
        "/CSSBASE/lcdp-central-module-08.css",
        "/CSSBASE/lcdp-central-module-12-gabarit-composants.css"
      ].forEach(path => document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(path) + '">'));
      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/table-lecture-admin.css"
      ].forEach(path => document.write('<link rel="stylesheet" href="' + window.LCDP_urlAdmin(path) + '">'));
    })();
  </script>
  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
  <style>
    .lcdp-page-ficheparc .lcdp-admin-page-content { min-width: 0; }
    .lcdp-page-ficheparc .lcdp-ficheparc-titre { margin: 0 0 12px; }
    .lcdp-page-ficheparc .lcdp-ficheparc-description { margin-bottom: 20px; }
    .lcdp-page-ficheparc .lcdp-ficheparc-action { text-align: center; }
    .lcdp-page-ficheparc .lcdp-table-lecture-admin__cell-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      min-height: 40px;
      padding: 5px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .lcdp-page-ficheparc .lcdp-table-lecture-admin__table td:last-child { text-align: center; }
    .lcdp-page-ficheparc .lcdp-table-lecture-admin__cell-action { color: #556f42; }
    .lcdp-page-ficheparc .lcdp-table-lecture-admin__cell-action svg {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .lcdp-page-ficheparc .lcdp-ficheparc-apercu-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 14px 0 20px; }
    .lcdp-page-ficheparc .lcdp-ficheparc-apercu-meta { margin: 4px 0 14px; }
    .lcdp-page-ficheparc .lcdp-ficheparc-frame {
      width: 100%;
      max-width: 100%;
      height: 720px;
      border: 1px solid var(--lcdp-color-border-strong, #ccc);
      display: block;
      box-sizing: border-box;
    }
    .lcdp-page-ficheparc [hidden] { display: none !important; }
  </style>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-statutparc lcdp-page-ficheparc">
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section class="lcdp-page-section" aria-label="Consulter la fiche d’un parc">
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">
            <div id="lcdp-menu-gauche-admin-slot"></div>
            <div class="lcdp-admin-page-content">
              <div id="lcdp-ficheparc-liste">
                <h1 class="lcdp-ficheparc-titre">Fiche Parc</h1>
                <p class="lcdp-ficheparc-description">Filtrez par département ou recherchez un parc, puis cliquez sur l’icône de fiche pour consulter son aperçu.</p>
                <div id="lcdp-table-lecture-admin-slot"></div>
              </div>
              <section id="lcdp-ficheparc-apercu" aria-label="Aperçu de la fiche parc" hidden>
                <h2 id="lcdp-ficheparc-apercu-nom">Fiche parc</h2>
                <p id="lcdp-ficheparc-apercu-meta" class="lcdp-ficheparc-apercu-meta"></p>
                <div class="lcdp-ficheparc-apercu-actions">
                  <button type="button" id="lcdp-ficheparc-retour" class="lcdp-button lcdp-button-secondary">Retour à la liste des parcs</button>
                  <a id="lcdp-ficheparc-ouvrir" class="lcdp-button lcdp-button-secondary" target="_blank" rel="noopener noreferrer" hidden>Ouvrir la fiche dans un nouvel onglet</a>
                </div>
                <div id="lcdp-ficheparc-contenu"></div>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./FicheParc.js"></script>
</body>
</html>
