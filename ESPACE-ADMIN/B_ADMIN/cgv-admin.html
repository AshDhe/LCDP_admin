<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>CGV - Administration - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Édition et publication des CGV de La Clé du Parc."
  >

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css?v=20261105-css-objets-complets-v1",
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/box-editeur-contenu.css",
        "/ESPACE-ADMIN/B_ADMIN/mentions-legales-admin.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });
    })();
  </script>

  <style>
    /* L’éditeur ne doit afficher aucune action tant que le document n’est pas chargé. */
    .lcdp-mentions-admin__actions[hidden],
    [data-lcdp-mentions-editeur-slot][hidden] { display: none !important; }
  </style>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>

<body class="lcdp-page-admin-interieure lcdp-page-mentions-legales-admin">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section
        class="lcdp-page-section"
        aria-label="Éditeur des CGV"
      >
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <header class="lcdp-mentions-admin__entete">
                <h1 class="lcdp-mentions-admin__titre">
                  CGV
                </h1>

                <p class="lcdp-mentions-admin__explication">
                  Modifie le brouillon, prévisualise le rendu, puis publie
                  lorsque la version est prête à être affichée dans l’espace membre.
                </p>

                <p
                  class="lcdp-mentions-admin__meta"
                  data-lcdp-mentions-meta
                ></p>

                <p
                  class="lcdp-mentions-admin__status"
                  data-lcdp-mentions-status
                  role="status"
                ></p>
              </header>

              <p
                class="lcdp-mentions-admin__loading"
                data-lcdp-mentions-loading
              >
                Chargement des CGV…
              </p>

              <div
                id="lcdp-editeur-mentions-slot"
                data-lcdp-mentions-editeur-slot
                hidden
              ></div>

              <div
                class="lcdp-mentions-admin__actions"
                data-lcdp-mentions-actions
                hidden
              >
                <button
                  type="button"
                  class="lcdp-button lcdp-button-primary"
                  data-lcdp-mentions-previsualiser
                >
                  Prévisualiser
                </button>

                <button
                  type="button"
                  class="lcdp-button lcdp-button-orange"
                  data-lcdp-mentions-enregistrer
                >
                  Enregistrer le brouillon
                </button>

                <button
                  type="button"
                  class="lcdp-button lcdp-button-orange"
                  data-lcdp-mentions-publier
                >
                  Publier
                </button>
              </div>

              <section
                class="lcdp-mentions-admin__preview"
                data-lcdp-mentions-preview
                hidden
                aria-label="Prévisualisation des CGV"
              >
                <h2 class="lcdp-mentions-admin__preview-title">
                  Prévisualisation
                </h2>

                <div
                  class="lcdp-mentions-admin__preview-content"
                  data-lcdp-mentions-preview-content
                ></div>
              </section>
            </div>

          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- Structure de l’éditeur partagé, locale à cette page pour éviter un fetch de fragment. -->
  <template id="lcdp-cgv-editeur-structure">
    <section
      class="lcdp-editeur-contenu"
      data-lcdp-editeur-contenu
      aria-label="Éditeur de contenu"
    >
      <div class="lcdp-editeur-contenu__entete">
        <p class="lcdp-editeur-contenu__aide">
          Chaque section comprend un titre et un ou plusieurs paragraphes.
        </p>
    
        <button
          type="button"
          class="lcdp-button lcdp-button-orange"
          data-lcdp-editeur-ajouter
        >
          Ajouter une section
        </button>
      </div>
    
      <div
        class="lcdp-editeur-contenu__blocs"
        data-lcdp-editeur-blocs
      ></div>
    
      <template data-lcdp-editeur-template>
        <article
          class="lcdp-editeur-contenu__bloc"
          data-lcdp-editeur-bloc
        >
          <div class="lcdp-editeur-contenu__bloc-entete">
            <label class="lcdp-editeur-contenu__titre-zone">
              <span class="lcdp-editeur-contenu__label">
                Titre de la section
              </span>
    
              <input
                type="text"
                class="lcdp-editeur-contenu__titre"
                maxlength="160"
                autocomplete="off"
                data-lcdp-editeur-titre
              >
            </label>
    
            <div
              class="lcdp-editeur-contenu__ordre"
              aria-label="Organisation de la section"
            >
              <button
                type="button"
                class="lcdp-button lcdp-button-secondary lcdp-editeur-contenu__petit-bouton"
                data-lcdp-editeur-monter
              >
                Monter
              </button>
    
              <button
                type="button"
                class="lcdp-button lcdp-button-secondary lcdp-editeur-contenu__petit-bouton"
                data-lcdp-editeur-descendre
              >
                Descendre
              </button>
    
              <button
                type="button"
                class="lcdp-button lcdp-button-orange lcdp-editeur-contenu__petit-bouton"
                data-lcdp-editeur-supprimer
              >
                Supprimer
              </button>
            </div>
          </div>
    
          <div
            class="lcdp-editeur-contenu__barre"
            role="toolbar"
            aria-label="Mise en forme du contenu"
          >
            <button type="button" data-lcdp-editeur-commande="bold" aria-label="Mettre en gras">
              Gras
            </button>
            <button type="button" data-lcdp-editeur-commande="italic" aria-label="Mettre en italique">
              Italique
            </button>
            <button type="button" data-lcdp-editeur-commande="insertUnorderedList" aria-label="Créer une liste à puces">
              Liste à puces
            </button>
            <button type="button" data-lcdp-editeur-commande="insertOrderedList" aria-label="Créer une liste numérotée">
              Liste numérotée
            </button>
            <button type="button" data-lcdp-editeur-lien aria-label="Ajouter un lien">
              Lien
            </button>
            <button type="button" data-lcdp-editeur-commande="unlink" aria-label="Supprimer le lien">
              Retirer le lien
            </button>
            <button type="button" data-lcdp-editeur-commande="removeFormat" aria-label="Supprimer la mise en forme">
              Effacer la mise en forme
            </button>
          </div>
    
          <div
            class="lcdp-editeur-contenu__lien"
            data-lcdp-editeur-lien-zone
            hidden
          >
            <label>
              <span>Adresse du lien</span>
              <input
                type="text"
                inputmode="url"
                placeholder="https://… ou /ESPACE-PUBLIC/…"
                autocomplete="off"
                data-lcdp-editeur-lien-url
              >
            </label>
    
            <div class="lcdp-editeur-contenu__lien-actions">
              <button
                type="button"
                class="lcdp-button lcdp-button-primary"
                data-lcdp-editeur-lien-appliquer
              >
                Appliquer le lien
              </button>
    
              <button
                type="button"
                class="lcdp-button lcdp-button-secondary"
                data-lcdp-editeur-lien-annuler
              >
                Annuler
              </button>
            </div>
          </div>
    
          <div
            class="lcdp-editeur-contenu__zone"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            spellcheck="true"
            data-lcdp-editeur-zone
          ></div>
    
          <p
            class="lcdp-editeur-contenu__erreur"
            data-lcdp-editeur-erreur
            role="alert"
            hidden
          ></p>
        </article>
      </template>
    </section>
  </template>

  <script src="./cgv-admin.js"></script>
</body>
</html>
