<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>À propos - Administration - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Gestion des titres À propos diffusés dans le bandeau de La Clé du Parc."
  >

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-dialogue-bouton.css",
        "/BOX/01-box-text.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/box-editeur-contenu.css",
        "/ESPACE-ADMIN/B_ADMIN/faq-admin.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });
    })();
  </script>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>

<body class="lcdp-page-admin-interieure lcdp-page-faq-admin">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section
        class="lcdp-page-section"
        aria-label="Titres À propos"
      >
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <header class="lcdp-mentions-admin__entete">
                <h1 class="lcdp-mentions-admin__titre">À propos</h1>
                <p class="lcdp-mentions-admin__explication">Ces titres sont diffusés dans le bandeau d’accueil avec l’étiquette A PROPOS. Tous ouvrent la page Le Club. Enregistre les modifications pour les diffuser.</p>
                <p role="status" data-apropos-status class="lcdp-mentions-admin__status"></p>
              </header>
              <fieldset data-apropos-commandes class="lcdp-editeur-contenu" disabled>
                <legend class="lcdp-editeur-contenu__label">Titres du bandeau</legend>
                <div data-apropos-liste class="lcdp-editeur-contenu__blocs"></div>
                <div class="lcdp-mentions-admin__actions">
                  <button type="button" class="lcdp-button lcdp-button-secondary" data-apropos-ajouter>Ajouter un titre</button>
                  <button type="button" class="lcdp-button lcdp-button-orange" data-apropos-enregistrer>Enregistrer et diffuser</button>
                </div>
              </fieldset>
            </div>

          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="./a-propos-admin.js"></script>
</body>
</html>
