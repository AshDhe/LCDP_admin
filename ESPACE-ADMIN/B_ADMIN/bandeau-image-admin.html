<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Bandeau image - Administration - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Édition du bandeau défilant d’images de l’accueil public."
  >

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
        "/CSSBASE/lcdp-bandeau-image.css",
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/box-editeur-contenu.css",
        "/ESPACE-ADMIN/B_ADMIN/faq-admin.css",
        "/ESPACE-ADMIN/B_ADMIN/bandeau-image-admin.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });
    })();
  </script>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>

<body class="lcdp-page-admin-interieure lcdp-page-faq-admin lcdp-page-bandeau-image-admin">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section
        class="lcdp-page-section"
        aria-label="Éditeur du bandeau image"
      >
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <header class="lcdp-mentions-admin__entete">
                <h1 class="lcdp-mentions-admin__titre">Bandeau image</h1>
                <p class="lcdp-mentions-admin__explication">Images carrées WebP. Chaque ajout est enregistré et vérifié dans GitHub. Le bandeau public s’affiche à partir de huit images.</p>
                <p role="status" aria-live="polite" data-bandeau-status class="lcdp-mentions-admin__status">Chargement…</p>
              </header>
              <fieldset data-bandeau-commandes class="lcdp-editeur-contenu" disabled>
                <legend class="lcdp-editeur-contenu__label">Images du bandeau</legend>
                <div class="lcdp-bandeau-admin-toolbar">
                  <label for="lcdp-bandeau-ajout" class="lcdp-button lcdp-button-orange lcdp-bandeau-admin-picker">Ajouter des images</label>
                  <input type="file" id="lcdp-bandeau-ajout" data-bandeau-ajouter accept="image/webp,.webp" multiple class="lcdp-bandeau-admin-file">
                  <input type="file" data-bandeau-remplacer accept="image/webp,.webp" hidden>
                  <span data-bandeau-compteur class="lcdp-editeur-contenu__aide"></span>
                </div>
                <section class="lcdp-editeur-contenu__bloc lcdp-bandeau-admin-preview" data-bandeau-preview-wrap hidden>
                  <h2 class="lcdp-editeur-contenu__label">Prévisualisation du défilement</h2>
                  <div data-bandeau-preview class="lcdp-bandeau-image" hidden></div>
                </section>
                <div data-bandeau-liste class="lcdp-editeur-contenu__blocs lcdp-bandeau-admin-liste"></div>
                <div data-bandeau-attente class="lcdp-editeur-contenu__blocs" hidden></div>
              </fieldset>
            </div>

          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="./bandeau-image-admin.js"></script>
</body>
</html>
