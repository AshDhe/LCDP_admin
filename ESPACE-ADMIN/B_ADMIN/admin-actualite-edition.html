<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Actualité - Administration - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Gestion et publication des actualités de La Clé du Parc."
  >

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-dialogue-bouton.css",
        "/BOX/03-box-formulaire.css",
        "/BOX/03-box-champ-formulaire.css",
        "/BOX/01-box-carrousel.css",
        "/BOX/01-box-actualite.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">' 
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">' 
        );
      });
    })();
  </script>

  <script>document.write('<script src="' + window.LCDP_urlPublic("/ESPACE-PUBLIC/actualite-groupes.js") + '"><\/script>');</script>
  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>

<body class="lcdp-page-admin-interieure lcdp-page-admin-actualite">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section
        class="lcdp-page-section"
        aria-label="Gestion des actualités"
      >
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <h1>Éditer une actualité</h1>
              <p data-lcdp-actualite-status role="status"></p>
              <p data-lcdp-actualite-meta></p>
              <p data-lcdp-actualite-loading>Chargement…</p>
              <div data-lcdp-actualite-contenu hidden>
                <form data-edition class="lcdp-box-formulaire lcdp-stack">
                  <div class="lcdp-box-champ-formulaire"><label class="lcdp-box-champ-formulaire__label" for="actu-groupe">Groupe</label><select id="actu-groupe" name="groupe" required><option value="RESEAU">RÉSEAU</option><option value="CLUB">CLUB</option><option value="COACHS">COACHS</option><option value="ASSO">ASSO</option></select><span data-groupe-preview></span></div>
                  <div class="lcdp-box-champ-formulaire"><label class="lcdp-box-champ-formulaire__label" for="actu-titre">Titre</label><input type="text" id="actu-titre" name="titre" required maxlength="160"></div>
                  <label>Image WebP<input name="image" type="file" accept="image/webp,.webp"></label>
                  <p>Image entière, centrée, cadre 16:9. Maximum 15 Mio. Aucun recadrage ni déformation.</p>
                  <div class="lcdp-box-carousel__viewport" data-image-frame hidden><img data-image-preview class="lcdp-box-carousel__image" alt=""></div>
                  <div class="lcdp-box-champ-formulaire"><label class="lcdp-box-champ-formulaire__label" for="actu-alt">Description de l’image</label><input type="text" id="actu-alt" name="alt" required maxlength="250"></div>
                  <div class="lcdp-box-champ-formulaire"><label class="lcdp-box-champ-formulaire__label" for="actu-texte">Texte</label><textarea id="actu-texte" name="texte" required maxlength="20000"></textarea></div>
                  <div class="lcdp-box-champ-formulaire"><label class="lcdp-box-champ-formulaire__label" for="actu-contact">Contact</label><input type="text" id="actu-contact" name="contact" maxlength="250"><p class="lcdp-box-formulaire__note">Information libre sur une ligne, affichée en texte dans l’article.</p></div>
                  <label class="lcdp-box-champ-formulaire__label"><input name="popup" type="checkbox"> Pop-up</label>
                  <p data-popup-aide></p>
                  <div class="lcdp-box-formulaire__actions">
                    <button type="submit" class="lcdp-button lcdp-button-orange">Enregistrer l’article</button>
                    <a class="lcdp-button" href="./admin-actualite.html">Retour à la liste</a>
                  </div>
                </form>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="./admin-actualite.js"></script>
</body>
</html>
