<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Carrousels - Administration - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Édition et publication des carrousels de La Clé du Parc."
  >

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/box-editeur-contenu.css",
        "/ESPACE-ADMIN/B_ADMIN/faq-admin.css",
        "/ESPACE-ADMIN/B_ADMIN/carrousels-admin.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });
    })();
  </script>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>

<body class="lcdp-page-admin-interieure lcdp-page-faq-admin lcdp-page-carrousels-admin">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section
        class="lcdp-page-section"
        aria-label="Éditeur des carrousels"
      >
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <header class="lcdp-mentions-admin__entete">
                <h1 class="lcdp-mentions-admin__titre">Carrousels</h1>
                <p role="status" aria-live="polite" data-carrousels-status class="lcdp-mentions-admin__status">Chargement des carrousels…</p>
              </header>
              <fieldset data-carrousels-commandes class="lcdp-editeur-contenu" disabled>
                <legend class="lcdp-editeur-contenu__label">Carrousels existants</legend>
                <div data-carrousels-liste class="lcdp-editeur-contenu__blocs"></div>
                <p data-carrousels-resultat class="lcdp-carrousel-resultat" role="status" aria-live="polite" hidden></p>
                <div class="lcdp-mentions-admin__actions">
                  <button type="button" class="lcdp-button lcdp-button-secondary" data-carrousels-ajouter>Créer un carrousel</button>
                  <button type="button" class="lcdp-button lcdp-button-orange" data-carrousels-enregistrer>Enregistrer</button>
                </div>
                <section data-carrousels-editeur class="lcdp-editeur-contenu__bloc lcdp-carrousels-editeur" hidden aria-label="Modifier le carrousel"></section>
              </fieldset>
            </div>

          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="./carrousels-admin.js"></script>
</body>
</html>
