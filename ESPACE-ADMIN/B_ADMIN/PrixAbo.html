<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>PrixAbo - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Administration des abonnements et de leurs prix."
  >

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        return typeof config.adminUrl === "function"
          ? config.adminUrl(path)
          : construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : construireUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/table-lecture-admin.css?v=20261112-ordrecolonnes2",
        "/ESPACE-ADMIN/B_ADMIN/PrixAbo.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });
    })();
  </script>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-prixabo">
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section
        class="lcdp-page-section"
        aria-label="Prix des abonnements"
      >
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">
            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <header class="lcdp-prixabo__entete">
                <div>
                  <h1 class="lcdp-prixabo__titre">Prix des abonnements</h1>
                  <p class="lcdp-prixabo__explication">
                    Consulte, ajoute ou modifie les abonnements et leurs prix.
                  </p>
                </div>

                <button
                  type="button"
                  class="lcdp-button lcdp-button-orange"
                  id="lcdp-prixabo-ajouter"
                >
                  Ajouter un abonnement
                </button>
              </header>

              <div id="lcdp-prixabo-table-slot"></div>
              <div id="lcdp-prixabo-edition-slot" hidden></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./PrixAbo.js?v=20261112-ordrecolonnes2"></script>
  <script>
    (() => {
      "use strict";
      const slot = document.getElementById("lcdp-prixabo-table-slot");
      if (!slot) return;

      function installer() {
        const scroll = slot.querySelector("[data-lcdp-table-lecture-admin-scroll]");
        const table = scroll?.querySelector("table");
        if (!scroll || !table) return false;

        // Supprimer tout élément créé par un ancien script encore en cache.
        slot.querySelectorAll("[data-lcdp-prixabo-scroll-haut]").forEach(el => el.remove());

        const haut = document.createElement("div");
        haut.setAttribute("data-lcdp-prixabo-scroll-haut", "");
        haut.setAttribute("aria-label", "Défilement horizontal en haut du tableau");
        haut.setAttribute("role", "region");
        haut.tabIndex = 0;
        haut.style.cssText =
          "box-sizing:border-box;display:block;width:100%;max-width:100%;" +
          "height:23px;overflow-x:scroll;overflow-y:hidden;margin:0 0 8px;";
        const piste = document.createElement("div");
        piste.style.height = "1px";
        haut.appendChild(piste);
        scroll.before(haut);

        let synchronise = false;
        haut.addEventListener("scroll", () => {
          if (synchronise) return;
          synchronise = true;
          scroll.scrollLeft = haut.scrollLeft;
          synchronise = false;
        });
        scroll.addEventListener("scroll", () => {
          if (synchronise) return;
          synchronise = true;
          haut.scrollLeft = scroll.scrollLeft;
          synchronise = false;
        });
        const ajuster = () => {
          haut.style.display = scroll.hidden ? "none" : "block";
          piste.style.width = Math.max(scroll.scrollWidth, table.scrollWidth, scroll.clientWidth + 2) + "px";
          haut.scrollLeft = scroll.scrollLeft;
        };
        const observer = new MutationObserver(ajuster);
        observer.observe(scroll, { attributes: true, attributeFilter: ["hidden", "style"] });
        if (typeof ResizeObserver === "function") {
          const resize = new ResizeObserver(ajuster);
          resize.observe(scroll);
          resize.observe(table);
        }
        window.addEventListener("resize", ajuster);
        ajuster();
        return true;
      }
      if (installer()) return;
      const attente = new MutationObserver(() => {
        if (installer()) attente.disconnect();
      });
      attente.observe(slot, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
