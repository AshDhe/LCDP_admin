<!doctype html>
<html lang="fr" data-lcdp-css="c081">
<head>
  <meta charset="utf-8">

  <title>ListAdmin - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Liste des comptes administrateurs La Clé du Parc.">

  <script src="../../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function construireUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" +
          String(path || "").replace(/^\/+/, "");
      }

      const adminBase = nettoyerBaseUrl(
        config.adminBaseUrl ||
        config.ADMIN_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        construireUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = adminBase;
      window.LCDP_ADMIN_BASE = adminBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlAdmin = function LCDP_urlAdmin(path) {
        if (typeof config.adminUrl === "function") {
          return config.adminUrl(path);
        }

        return construireUrl(adminBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return construireUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return construireUrl(objetBase, path);
      };

      ["/CSSBASE/cssbase.css", "/CSSBASE/lcdp-central-mobile-first.css"].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });

      // Styles centralisés des onglets et du dialogue SUPPRESSION.
      [
        "/CSSBASE/lcdp-central-module-05.css",
        "/CSSBASE/lcdp-lightbox-convergence.css"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' + window.LCDP_urlObjet(path) + '">'
        );
      });

      ["/ESPACE-ADMIN/A_STRUCTURE/css-admin.css"].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlAdmin(path) +
          '">'
        );
      });

    })();
  </script>

  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-listadmin">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section class="lcdp-page-section" aria-label="Liste des administrateurs">
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">

            <div id="lcdp-menu-gauche-admin-slot"></div>

            <div class="lcdp-admin-page-content">
              <section class="lcdp-wraper-onglets" data-lcdp-wraper-onglets aria-label="Comptes de l'espace admin">
                <div class="lcdp-wraper-onglets__navigation" role="tablist" aria-label="Types de comptes" data-lcdp-wraper-onglets-navigation></div>
                <div class="lcdp-wraper-onglets__contenu"></div>
              </section>
              <p id="lcdp-listadmin-statut" class="lcdp-table-lecture-admin__status" role="status" aria-live="polite"></p>
            </div>

          </div>
        </div>
      </section>
    </main>

    <!-- Profil SUPPRESSION du système de dialogue centralisé : aucun CSS local. -->
    <div class="lcdp-dialogue-ref lcdp-dialogue-ref--suppression"
      id="lcdp-admin-confirmation-suppression" role="dialog"
      aria-modal="true" aria-labelledby="lcdp-ref-suppression-titre"
      aria-describedby="lcdp-ref-suppression-message"
      data-lcdp-dialogue-reference="suppression" hidden>
      <div class="lcdp-dialogue-ref__card">
        <div class="lcdp-dialogue-ref__icone" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <h3 class="lcdp-dialogue-ref__titre" id="lcdp-ref-suppression-titre">
          Supprimer cet administrateur ?
        </h3>
        <p class="lcdp-dialogue-ref__message" id="lcdp-ref-suppression-message"></p>
        <div class="lcdp-dialogue-ref__actions lcdp-dialogue-ref__actions--choix">
          <button type="button"
            class="lcdp-dialogue-ref__bouton lcdp-dialogue-ref__bouton--secondaire"
            data-lcdp-dialogue-action="conserver">Conserver</button>
          <button type="button"
            class="lcdp-dialogue-ref__bouton lcdp-dialogue-ref__bouton--suppression"
            data-lcdp-dialogue-action="supprimer">Oui, supprimer</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function urlAdmin(path) {
        return typeof window.LCDP_urlAdmin === "function"
          ? window.LCDP_urlAdmin(path)
          : path;
      }

      function urlPublic(path) {
        return typeof window.LCDP_urlPublic === "function"
          ? window.LCDP_urlPublic(path)
          : path;
      }

      function urlObjet(path) {
        return typeof window.LCDP_urlObjet === "function"
          ? window.LCDP_urlObjet(path)
          : path;
      }

      function appliquerRoutes(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          const path = element.dataset.siteHref || "";
          const space = element.dataset.space || "public";

          element.setAttribute(
            "href",
            space === "admin" ? urlAdmin(path) : urlPublic(path)
          );
        });

        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          const path = String(element.dataset.siteSrc || "")
            .replace(/^\/?OBJET\/?/, "/");

          element.setAttribute("src", urlObjet(path));
        });
      }

      async function chargerFragment(url, libelle) {
        const response = await fetch(url, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(libelle + " introuvable.");
        }

        const template = document.createElement("template");
        template.innerHTML = (await response.text()).trim();

        return template.content.cloneNode(true);
      }

      function chargerFragmentAdmin(path) {
        return chargerFragment(
          urlAdmin(path),
          "Fragment ADMIN " + path
        );
      }

      function chargerFragmentObjet(path) {
        return chargerFragment(
          urlObjet(path),
          "Fragment OBJET " + path
        );
      }

      function chargerScriptAdminUneFois(path) {
        const src = urlAdmin(path);

        if (
          document.querySelector(
            `script[data-lcdp-script-admin="${path}"]`
          )
        ) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.dataset.lcdpScriptAdmin = path;
          script.onload = resolve;
          script.onerror = () => reject(
            new Error("Script ADMIN introuvable : " + path)
          );
          document.body.appendChild(script);
        });
      }

      async function initialiserBandeau() {
        const slot = document.getElementById("lcdp-bandeau-slot");

        if (!slot) {
          return;
        }

        slot.innerHTML = "";

        const fragment = await chargerFragmentAdmin(
          "/ESPACE-ADMIN/A_STRUCTURE/box-bandeau-nav-admin.html"
        );

        slot.appendChild(fragment);
        appliquerRoutes(slot);
      }

      async function initialiserMenuGauche() {
        const moduleMenu = window.LCDP_MENU_GAUCHE_ADMIN;

        if (!moduleMenu || typeof moduleMenu.initialiser !== "function") {
          throw new Error("Menu gauche admin centralisé indisponible.");
        }

        await moduleMenu.initialiser({
          slotId: "lcdp-menu-gauche-admin-slot",
          categorieActive: "admin"
        });
      }

      function endpointAdminData() {
        return String(
          config.workerAdminDataUrl ||
          config.WORKER_ADMIN_DATA_URL ||
          window.ADMIN_CONFIG?.API_ADMIN_DATA ||
          ""
        ).replace(/\/+$/, "");
      }

      function endpointAdminSession() {
        return String(
          config.workerAdminComptesUrl ||
          config.WORKER_ADMIN_COMPTES_URL ||
          window.ADMIN_CONFIG?.API_ADMIN_COMPTES ||
          ""
        ).replace(/\/+$/, "");
      }

      async function chargerScriptObjetUneFois(path) {
        const src = urlObjet(path);
        if (document.querySelector('script[data-lcdp-script-objet="' + path + '"]')) return;
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.dataset.lcdpScriptObjet = path;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Composant onglets indisponible."));
          document.body.appendChild(script);
        });
      }

      async function initialiserListe() {
        await chargerScriptObjetUneFois("/JSBASE/05-wraper-onglets.js");
        await chargerScriptAdminUneFois("/ESPACE-ADMIN/B_ADMIN/listadmin.js");
        if (typeof window.LCDP_LISTADMIN?.initialiser !== "function") {
          throw new Error("Liste des administrateurs indisponible.");
        }
        await window.LCDP_LISTADMIN.initialiser({
          racine: document.querySelector("[data-lcdp-wraper-onglets]"),
          status: document.getElementById("lcdp-listadmin-statut"),
          adminDataUrl: endpointAdminData(),
          adminSessionUrl: endpointAdminSession(),
          autorisation: window.LCDP_ADMIN_AUTORISATION
        });
      }

      async function verifierAcces() {
        const guard = window.LCDP_GUARD_ADMIN;

        if (
          !guard ||
          typeof guard.verifierAccesPageAdmin !== "function"
        ) {
          throw new Error("Garde admin centralisé indisponible.");
        }

        return guard.verifierAccesPageAdmin();
      }

      function afficherErreurPage(message) {
        const statut = document.getElementById("lcdp-listadmin-statut");
        const main = document.getElementById("lcdp-main-admin");
        if (main) main.hidden = false;
        if (statut) {
          statut.hidden = false;
          statut.setAttribute("role", "alert");
          statut.textContent = message || "Impossible de charger cette page.";
        }
      }

      async function initialiserPage() {
        const autorise = await verifierAcces();
        if (!autorise) return;

        // Dès que le droit d'accès est confirmé, afficher la page,
        // indépendamment du chargement du menu, du bandeau et du Worker.
        const main = document.getElementById("lcdp-main-admin");
        if (main) main.hidden = false;

        const resultats = await Promise.allSettled([
          initialiserBandeau(),
          initialiserMenuGauche(),
          initialiserListe()
        ]);

        const erreurs = resultats
          .filter((resultat) => resultat.status === "rejected")
          .map((resultat) => resultat.reason?.message || "Composant indisponible.");

        if (erreurs.length > 0) {
          console.error("Initialisation partielle de ListAdmin :", erreurs);
          afficherErreurPage("Certains éléments n'ont pas pu être chargés : " + erreurs.join(" ; "));
        }
      }

      initialiserPage().catch((error) => {
        console.error("Erreur ListAdmin :", error);
        afficherErreurPage(error?.message || "Erreur technique lors du chargement de la page.");
      });
    })();
  </script>
</body>
</html>
