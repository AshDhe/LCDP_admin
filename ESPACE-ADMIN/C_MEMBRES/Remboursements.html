<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remboursements — Administration La Clé du Parc</title>
  <meta name="description" content="Suivi administratif des remboursements des membres.">
  <script src="../../config.js"></script>
  <script>
    (() => {
      "use strict";
      const c = window.SITE_CONFIG || {};
      const base = v => String(v || "").replace(/\/+$/, "");
      const join = (b,p) => base(b) + "/" + String(p || "").replace(/^\/+/, "");
      const admin = base(c.adminBaseUrl || c.ADMIN_BASE || c.siteBase || "");
      const publicBase = base(c.publicBaseUrl || c.PUBLIC_BASE || "");
      const objet = base(c.objetBaseUrl || c.OBJET_BASE || join(publicBase,"/OBJET"));
      window.LCDP_urlAdmin = p => typeof c.adminUrl === "function" ? c.adminUrl(p) : join(admin,p);
      window.LCDP_urlPublic = p => typeof c.publicUrl === "function" ? c.publicUrl(p) : join(publicBase,p);
      window.LCDP_urlObjet = p => typeof c.objetUrl === "function" ? c.objetUrl(p) : join(objet,p);
      ["/CSSBASE/cssbase.css","/CSSBASE/lcdp-central-mobile-first.css","/CSSBASE/lcdp-navigation-onglets.css"].forEach(p => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(p) + '">');
      });
      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/table-lecture-admin.css",
        "/ESPACE-ADMIN/C_MEMBRES/VentesAbo.css"
      ].forEach(p => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlAdmin(p) + '">');
      });
    })();
  </script>
  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-ventesabo">
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section class="lcdp-page-section" aria-label="Remboursements des membres">
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">
            <div id="lcdp-menu-gauche-admin-slot"></div>
            <div class="lcdp-admin-page-content lcdp-stack">
              <header class="lcdp-ventesabo__entete">
                <h1>Remboursements des membres</h1>
                <button id="remb-actualiser" class="lcdp-button lcdp-button-secondary" type="button">Actualiser</button>
              </header>
              <div class="lcdp-wraper-onglets lcdp-wraper-onglets--2 lcdp-stack">
              <div class="lcdp-navigation-onglets lcdp-wraper-onglets__navigation" role="tablist" aria-label="Remboursements">
                <button type="button" class="lcdp-navigation-onglets__onglet" id="remb-tab-faire" role="tab" aria-controls="remb-faire" aria-selected="true" aria-pressed="true">À faire</button>
                <button type="button" class="lcdp-navigation-onglets__onglet" id="remb-tab-stripe" role="tab" aria-controls="remb-stripe" aria-selected="false" aria-pressed="false" tabindex="-1">Suivi Stripe</button>
              </div>
              <p id="remb-statut" role="status" aria-live="polite"></p>
              <section id="remb-faire" role="tabpanel" aria-labelledby="remb-tab-faire">
                <div class="lcdp-table-lecture-admin">
                  <div class="lcdp-table-lecture-admin__scroll" tabindex="0">
                    <table class="lcdp-table-lecture-admin__table">
                      <thead><tr>
                        <th scope="col">Nom</th><th scope="col">IBAN</th><th scope="col">Montant TTC</th><th scope="col">Échéance</th>
                        <th scope="col">Remboursement manuel</th><th scope="col">Remboursement Stripe</th><th scope="col">Date de remboursement</th>
                      </tr></thead>
                      <tbody id="remb-lignes-faire"></tbody>
                    </table>
                  </div>
                </div>
              </section>
              <section id="remb-stripe" role="tabpanel" aria-labelledby="remb-tab-stripe" hidden>
                <div class="lcdp-table-lecture-admin">
                  <div class="lcdp-table-lecture-admin__scroll" tabindex="0">
                    <table class="lcdp-table-lecture-admin__table">
                      <thead><tr>
                        <th scope="col">Nom</th><th scope="col">IBAN</th><th scope="col">Montant TTC</th><th scope="col">Échéance</th>
                        <th scope="col">Statut Stripe</th><th scope="col">Date de déclenchement</th><th scope="col">Remboursement manuel</th><th scope="col">Date de remboursement</th>
                      </tr><tr>
                        <td colspan="4"></td><td>
                          <select id="remb-filtre-stripe" class="lcdp-table-lecture-admin__filter-input" aria-label="Filtrer le statut Stripe">
                            <option value="definitif" selected>Échecs définitifs / annulations</option>
                            <option value="failed">Échec définitif</option>
                            <option value="canceled">Annulé</option>
                            <option value="requires_action">Action requise</option>
                            <option value="pending">En cours</option>
                            <option value="inconnu">Statut non confirmé</option>
                            <option value="tous">Tous les dossiers non clôturés</option>
                          </select>
                        </td><td colspan="3"></td>
                      </tr></thead>
                      <tbody id="remb-lignes-stripe"></tbody>
                    </table>
                  </div>
                </div>
              </section>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./Remboursements.js?v=20261125-mode-test"></script>
</body>
</html>
