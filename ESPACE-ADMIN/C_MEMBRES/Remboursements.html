<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remboursements — Administration La Clé du Parc</title>
  <meta name="description" content="Suivi administratif des remboursements des membres.">
  <script src="../../config.js"></script>
  <script>
    (() => {
      "use strict";
      const c = window.SITE_CONFIG || {};
      const base = v => String(v || "").replace(/\/+$/, "");
      const join = (b,p) => base(b) + "/" + String(p || "").replace(/^\/+/, "");
      const admin = base(c.adminBaseUrl || c.ADMIN_BASE || c.siteBase || "");
      const publicBase = base(c.publicBaseUrl || c.PUBLIC_BASE || "");
      const objet = base(c.objetBaseUrl || c.OBJET_BASE || join(publicBase,"/OBJET"));
      window.LCDP_urlAdmin = p => typeof c.adminUrl === "function" ? c.adminUrl(p) : join(admin,p);
      window.LCDP_urlPublic = p => typeof c.publicUrl === "function" ? c.publicUrl(p) : join(publicBase,p);
      window.LCDP_urlObjet = p => typeof c.objetUrl === "function" ? c.objetUrl(p) : join(objet,p);
      ["/CSSBASE/cssbase.css","/CSSBASE/lcdp-central-mobile-first.css"].forEach(p => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(p) + '">');
      });
      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/table-lecture-admin.css",
        "/ESPACE-ADMIN/C_MEMBRES/VentesAbo.css"
      ].forEach(p => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlAdmin(p) + '">');
      });
    })();
  </script>
  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-ventesabo">
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section class="lcdp-page-section" aria-label="Remboursements des membres">
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">
            <div id="lcdp-menu-gauche-admin-slot"></div>
            <div class="lcdp-admin-page-content lcdp-stack">
              <header class="lcdp-ventesabo__entete">
                <h1>Remboursements des membres</h1>
                <button id="remb-actualiser" class="lcdp-button lcdp-button-secondary" type="button">Actualiser</button>
              </header>
              <p id="remb-statut" role="status" aria-live="polite"></p>
              <div id="remb-table-slot"></div>
              <template id="remb-table-template">
                <div class="lcdp-table-lecture-admin">
                  <div class="lcdp-table-lecture-admin__scroll" tabindex="0">
                    <table class="lcdp-table-lecture-admin__table">
                      <thead><tr><th scope="col">Nom</th><th scope="col">IBAN</th><th scope="col">Montant TTC</th><th scope="col">Échéance</th><th scope="col">Remboursé</th><th scope="col">Date de remboursement</th><th scope="col">Action</th></tr></thead><tbody id="remb-lignes"></tbody>
                    </table>
                  </div>
                </div>
              </template>
              <div id="remb-detail"></div>
              <template id="remb-form-template">
                <section class="lcdp-stack">
                  <h2 class="lcdp-text-strong-left">Remboursement effectué ?</h2>
                  <p id="remb-selection"></p>
                  <form id="remb-form" class="lcdp-stack">
                    <input id="remb-montant" type="hidden">
                    <label>Date et heure du remboursement
                      <input id="remb-date" class="lcdp-table-lecture-admin__filter-input" type="datetime-local" required>
                    </label>
                    <label>Référence bancaire ou Stripe
                      <input id="remb-reference" class="lcdp-table-lecture-admin__filter-input" type="text" maxlength="200" minlength="3" required autocomplete="off">
                    </label>
                    <details>
                      <summary>Autre moyen de remboursement</summary>
                      <label>Mode utilisé
                        <select id="remb-mode" class="lcdp-table-lecture-admin__filter-input" required><option value="stripe">Stripe</option><option value="virement">Virement bancaire</option><option value="autre">Autre moyen</option></select>
                      </label>
                      <div id="remb-accord-slot"></div>
                    </details>
                    <template id="remb-accord-template"><label>Référence de l’accord du membre pour le changement de moyen de paiement
                      <input id="remb-accord" class="lcdp-table-lecture-admin__filter-input" type="text" maxlength="500" required autocomplete="off">
                    </label></template>
                    <p class="lcdp-text-muted">Confirmer uniquement un remboursement déjà effectué.</p>
                    <div class="lcdp-stack-small">
                      <button id="remb-valider" type="submit" class="lcdp-button lcdp-button-primary">Oui, enregistrer</button>
                      <button id="remb-fermer" type="button" class="lcdp-button lcdp-button-secondary">Annuler</button>
                    </div>
                    <p id="remb-message" role="status" aria-live="polite"></p>
                  </form>
                </section>
              </template>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./Remboursements.js?v=20261125-table-action"></script>
</body>
</html>
