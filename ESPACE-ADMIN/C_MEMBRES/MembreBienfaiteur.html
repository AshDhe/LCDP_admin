<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membre bienfaiteur — La Clé du Parc, administration</title>
  <meta name="description" content="Rubrique Membre bienfaiteur de l’espace administrateur.">
  <script src="../../config.js"></script>
  <script>
    (() => {
      "use strict";
      const c=window.SITE_CONFIG||{};
      const base=x=>String(x||"").replace(/\/+$/,"");
      const join=(b,p)=>base(b)+"/"+String(p||"").replace(/^\/+/,"");
      const a=base(c.adminBaseUrl||c.ADMIN_BASE||c.siteBase||"");
      const p=base(c.publicBaseUrl||c.PUBLIC_BASE||"");
      const o=base(c.objetBaseUrl||c.OBJET_BASE||join(p,"/OBJET"));
      window.LCDP_urlAdmin=x=>typeof c.adminUrl==="function"?c.adminUrl(x):join(a,x);
      window.LCDP_urlPublic=x=>typeof c.publicUrl==="function"?c.publicUrl(x):join(p,x);
      window.LCDP_urlObjet=x=>typeof c.objetUrl==="function"?c.objetUrl(x):join(o,x);
      ["/CSSBASE/cssbase.css","/CSSBASE/lcdp-central-mobile-first.css"].forEach(x=>{
        document.write('<link rel="stylesheet" href="'+window.LCDP_urlObjet(x)+'">');
      });
      document.write('<link rel="stylesheet" href="'+window.LCDP_urlAdmin("/ESPACE-ADMIN/A_STRUCTURE/css-admin.css")+'">');
    })();
  </script>
  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure">
<div class="lcdp-site-page">
  <div id="lcdp-bandeau-slot"></div>
  <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
    <section class="lcdp-page-section" aria-label="Membre bienfaiteur">
      <div class="lcdp-page-container">
        <div class="lcdp-admin-page-layout">
          <div id="lcdp-menu-gauche-admin-slot"></div>
          <div class="lcdp-admin-page-content">
            <h1>Membre bienfaiteur</h1>
            <p id="lcdp-membres-page-statut" role="status">La rubrique Membre bienfaiteur est référencée dans le menu admin. La page publique correspondante indique actuellement « Section en sommeil ». Elle ne comporte pas de gestion administrative active.</p>
            <p><a href="https://lacleduparc.fr/ESPACE-PUBLIC/membre-bienfaiteur.html" target="_blank" rel="noopener noreferrer">Voir la page publique Membre bienfaiteur</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="./RubriquesMembresAdmin.js"></script>
</body>
</html>
