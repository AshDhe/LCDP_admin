<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi DFA — Administration La Clé du Parc</title>
  <meta name="description" content="Suivi administratif des dotations financières annuelles.">
  <script src="../../config.js"></script>
  <script>
    (() => {
      "use strict";
      const c = window.SITE_CONFIG || {};
      const base = v => String(v || "").replace(/\/+$/, "");
      const join = (b,p) => base(b) + "/" + String(p || "").replace(/^\/+/, "");
      const admin = base(c.adminBaseUrl || c.ADMIN_BASE || c.siteBase || "");
      const publicBase = base(c.publicBaseUrl || c.PUBLIC_BASE || "");
      const objet = base(c.objetBaseUrl || c.OBJET_BASE || join(publicBase,"/OBJET"));
      window.LCDP_urlAdmin = p => typeof c.adminUrl === "function" ? c.adminUrl(p) : join(admin,p);
      window.LCDP_urlPublic = p => typeof c.publicUrl === "function" ? c.publicUrl(p) : join(publicBase,p);
      window.LCDP_urlObjet = p => typeof c.objetUrl === "function" ? c.objetUrl(p) : join(objet,p);
      ["/CSSBASE/cssbase.css","/CSSBASE/lcdp-central-mobile-first.css"].forEach(p => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(p) + '">');
      });
      [
        "/ESPACE-ADMIN/A_STRUCTURE/css-admin.css",
        "/ESPACE-ADMIN/A_STRUCTURE/table-lecture-admin.css",
        "/ESPACE-ADMIN/C_MEMBRES/VentesAbo.css"
      ].forEach(p => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlAdmin(p) + '">');
      });
    })();
  </script>
  <script src="../A_STRUCTURE/guard-admin.js"></script>
  <script src="../A_STRUCTURE/menu-gauche-admin.js"></script>
</head>
<body class="lcdp-page-admin-interieure lcdp-page-ventesabo">
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" id="lcdp-main-admin" hidden>
      <section class="lcdp-page-section" aria-label="Suivi DFA">
        <div class="lcdp-page-container">
          <div class="lcdp-admin-page-layout">
            <div id="lcdp-menu-gauche-admin-slot"></div>
            <div class="lcdp-admin-page-content">
              <header class="lcdp-ventesabo__entete">
                <h1>Suivi DFA</h1>
                <button id="dfa-actualiser" class="lcdp-button lcdp-button-secondary" type="button">Actualiser</button>
              </header>
              <p id="dfa-statut" role="status" aria-live="polite">Chargement…</p>
              <label>Environnement <select id="dfa-mode" class="lcdp-table-lecture-admin__filter-input"><option value="live">Réel</option><option value="test">Test</option><option value="tous">Tous</option></select></label>
              <label>Statut <select id="dfa-filtre" class="lcdp-table-lecture-admin__filter-input"><option value="tous">Tous</option><option value="attente">En attente</option><option value="paye">Payé</option><option value="annule">Annulé</option><option value="incident">Incident</option></select></label>
              <div class="lcdp-table-lecture-admin lcdp-ventesabo__tableau">
                <div class="lcdp-table-lecture-admin__scroll" tabindex="0">
                  <table class="lcdp-table-lecture-admin__table">
                    <caption>Dotations financières annuelles individuelles</caption>
                    <thead><tr><th scope="col">Nom</th><th scope="col">Prénom</th><th scope="col">Création</th><th scope="col">Date limite</th><th scope="col">Statut</th><th scope="col">Mode</th><th scope="col">Brut</th><th scope="col">Frais Stripe</th><th scope="col">Net Stripe</th><th scope="col">Date paiement</th><th scope="col">Reçu fiscal</th><th scope="col">Email demande</th><th scope="col">Email reçu</th><th scope="col">Diagnostic</th><th scope="col">Référence</th><th scope="col">Incidents / contrôle</th></tr></thead>
                    <tbody id="dfa-lignes"></tbody>
                  </table>
                </div>
              </div>
              <button id="dfa-precedent" class="lcdp-button lcdp-button-secondary" type="button" disabled>Précédent</button>
              <button id="dfa-suivant" class="lcdp-button lcdp-button-secondary" type="button" disabled>Suivant</button>
              <section id="dfa-incidents" hidden><h2>Incidents de la dotation</h2><p id="dfa-incidents-statut" role="status"></p><div class="lcdp-table-lecture-admin"><div class="lcdp-table-lecture-admin__scroll" tabindex="0"><table class="lcdp-table-lecture-admin__table"><thead><tr><th>Date</th><th>Code</th><th>Occurrences</th><th>Dernière occurrence</th><th>Résolution</th></tr></thead><tbody id="dfa-incidents-lignes"></tbody></table></div></div></section>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./SuiviDFA.js?v=20261126-dfa-sans-cron-v2"></script>
</body>
</html>
